<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#05070D}
.card{--acc:#22F2E1;position:relative;width:1200px;height:630px;overflow:hidden;color:#EAF2FF;font-family:Inter,sans-serif;background:radial-gradient(55% 75% at 82% 50%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 70%),radial-gradient(50% 60% at 0% 100%,rgba(139,92,255,.22),transparent 70%),#05070D}
.floor{position:absolute;left:-50%;right:-50%;bottom:-2px;height:44%;background-image:linear-gradient(color-mix(in srgb,var(--acc) 45%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--acc) 45%,transparent) 1px,transparent 1px);background-size:64px 64px;transform:perspective(420px) rotateX(62deg);transform-origin:center bottom;-webkit-mask-image:linear-gradient(to top,#000 5%,transparent 85%);opacity:.6}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);pointer-events:none}
.shot{position:absolute;right:-230px;top:78px;width:760px;height:475px;border-radius:18px;overflow:hidden;border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);box-shadow:0 0 0 1px rgba(255,255,255,.04),0 40px 100px -20px rgba(0,0,0,.9),0 0 90px -10px color-mix(in srgb,var(--acc) 45%,transparent);transform:perspective(1400px) rotateY(-16deg) rotateX(4deg);transform-origin:left center;background:#070A12}
.shot .bar{height:30px;display:flex;align-items:center;gap:7px;padding:0 14px;background:#0A0E18;border-bottom:1px solid #1B2335;font:500 11px 'JetBrains Mono',monospace;color:#8E9AB0}
.shot .bar i{width:9px;height:9px;border-radius:50%;background:#E5484D}.shot .bar i:nth-child(2){background:#FFB547}.shot .bar i:nth-child(3){background:#22F2E1}
.shot .bar span{margin-left:10px}
.shot img{display:block;width:100%;height:calc(100% - 30px);object-fit:cover;object-position:top left}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,#05070D 0%,rgba(5,7,13,.97) 50%,rgba(5,7,13,.55) 66%,rgba(5,7,13,.1) 84%,transparent 100%);pointer-events:none}
.in{position:absolute;left:60px;top:50px;bottom:48px;width:600px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:13px}
.orb{width:42px;height:42px;border-radius:13px;border:3px solid #22F2E1;display:flex;align-items:center;justify-content:center;box-shadow:0 0 22px rgba(34,242,225,.45)}
.orb i{width:14px;height:14px;border-radius:50%;background:#22F2E1;box-shadow:0 0 14px #22F2E1}
.word{font-family:Unbounded;font-weight:800;font-size:24px;letter-spacing:.02em}.word b{color:#22F2E1}
.tag{margin-top:52px;font:500 16px 'JetBrains Mono',monospace;letter-spacing:.12em;color:var(--acc)}
h1{margin-top:16px;font-family:Unbounded;font-weight:800;line-height:1;letter-spacing:-.02em;text-transform:uppercase}
.g{background:linear-gradient(90deg,var(--acc),#8B5CFF 55%,#FF3DCB);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--acc) 30%,transparent))}
p.sub{margin-top:22px;max-width:600px;font-size:23px;line-height:1.4;color:#C9D4E6}
.foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:10px;font:700 14px 'JetBrains Mono',monospace;letter-spacing:.08em}
.foot span{border:1px solid #262E40;background:rgba(10,14,24,.9);border-radius:10px;padding:9px 13px;color:#A8B3C7}
.foot span:first-child{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.url{position:absolute;right:40px;bottom:30px;font:500 14px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#8E9AB0;background:rgba(5,7,13,.75);padding:6px 12px;border-radius:8px;border:1px solid #1B2335}
.url b{color:var(--acc);font-weight:700}
</style></head>
<body><div class="card" id="card">
<div class="floor"></div>
<div class="shot"><div class="bar"><i></i><i></i><i></i><span id="bar"></span></div><img id="img" alt=""></div>
<div class="fade"></div><div class="scan"></div>
<div class="in">
<div class="logo"><div class="orb"><i></i></div><div class="word">JESSI<b>.</b>AI</div></div>
<div class="tag" id="tag"></div>
<h1 id="h1"></h1>
<p class="sub" id="sub"></p>
<div class="foot" id="chips"></div>
</div>
<div class="url" id="url"></div>
</div>
<script>
window.fill = function (d) {
  var c = document.getElementById('card');
  c.style.setProperty('--acc', d.accent);
  document.getElementById('tag').textContent = d.tag;
  var h = document.getElementById('h1');
  h.textContent = d.head + ' ';
  var g = document.createElement('span'); g.className = 'g'; g.textContent = d.grad; h.appendChild(g);
  document.getElementById('sub').textContent = d.sub;
  var ch = document.getElementById('chips'); ch.textContent = '';
  d.chips.forEach(function (t) { var s = document.createElement('span'); s.textContent = t; ch.appendChild(s); });
  document.getElementById('img').src = d.shot;
  document.getElementById('bar').textContent = d.host + '/' + d.slug;
  var u = document.getElementById('url'); u.textContent = ''; u.append(d.host + '/'); var b = document.createElement('b'); b.textContent = d.slug; u.appendChild(b);
  // Fit the headline: shrink until it fits in 3 lines.
  var size = 60; h.style.fontSize = size + 'px';
  while (size > 36 && h.getBoundingClientRect().height > size * 3.05) { size -= 2; h.style.fontSize = size + 'px'; }
  return document.getElementById('img').decode ? document.getElementById('img').decode().catch(function () {}) : null;
};
</script>
</body></html>
